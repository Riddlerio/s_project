# 최소 CI(Phase 6 일부, 2026-10-05 사용자 승인): 테스트·빌드만 자동으로 돌린다. 배포·브랜치 보호는 하지 않는다.
# 로컬 회귀 명령(docs/audit/FROZEN_CORE_CONTRACT.md 6절)과 같은 검사를 GitHub에서 반복한다.
name: CI

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 프런트엔드(타입·테스트·빌드)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 빌드에는 dist 비밀 값 검사(scripts/check-dist.mjs)가 들어 있다.
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    name: 백엔드(pytest·DEMO API smoke)
    # 지금까지 검증한 개발 환경(Windows)과 같은 곳에서 돌린다.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      # test-temp는 무시 목록에 있어 새로 받은 저장소에는 없다. pytest 임시 폴더와 smoke DB가 쓴다.
      - run: New-Item -ItemType Directory -Force test-temp | Out-Null
      - run: python -m pytest -q -p no:cacheprovider --basetemp test-temp/ci
      - name: DEMO API smoke
        env:
          SEED_DEMO_DATA: "true"
          COOKIE_SECURE: "false"
          DATABASE_URL: sqlite:///./test-temp/ci-smoke.db
        run: |
          $server = Start-Process python -ArgumentList '-m','uvicorn','app.main:app','--host','127.0.0.1','--port','8000' -PassThru -NoNewWindow
          try {
            $ready = $false
            foreach ($i in 1..60) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/api/config/public | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw '서버가 60초 안에 뜨지 않았습니다' }
            python scripts/smoke_api.py http://127.0.0.1:8000
            if ($LASTEXITCODE -ne 0) { throw "smoke 실패($LASTEXITCODE)" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
